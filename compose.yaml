services:
  homelab-server:
    container_name: homelab-server
    
    build: .
    restart: unless-stopped

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

    environment:
      PROXMOX_URL: ${PROXMOX_URL:?Set PROXMOX_URL in .env}
      PROXMOX_API_TOKEN: ${PROXMOX_API_TOKEN:?Set PROXMOX_API_TOKEN in .env}
      PFSENSE_URL: ${PFSENSE_URL:?Set PFSENSE_URL in .env}
      PFSENSE_API_KEY: ${PFSENSE_API_KEY:? Set PFSENSE_API_KEY in .env}
      SSH_HOSTS: ${SSH_HOSTS:?Set SSH_HOSTS in .env}
      SSH_USER: ${SSH_USER:-homelab-mcp}
      SSH_KEY: /run/secrets/ssh_key
      SSH_KNOWN_HOSTS: /run/secrets/known_hosts
      LINUX_FILES: ${LINUX_FILES:?Set LINUX_FILES in .env}
      DOCKER_HOSTS: ${DOCKER_HOSTS:?Set DOCKER_HOSTS in .env}
      ZFS_HOSTS: ${ZFS_HOSTS:?Set ZFS_HOSTS in .env}

    volumes:
      - ./secrets/ssh_key:/run/secrets/ssh_key:ro
      - ./secrets/known_hosts:/run/secrets/known_hosts:ro

    tmpfs:
      - /tmp:size=16m,nosuid,nodev,noexec

    networks:
      - homelab-backend
      - mcp
      - docker-proxy


  homelab-tunnel:
    container_name: homelab-tunnel

    build:
      context: "https://github.com/openai/tunnel-client.git#${TUNNEL_CLIENT_VERSION:-v0.0.10}"
      args:
        GIT_SHA: ${TUNNEL_CLIENT_VERSION:-v0.0.10}

    image: homelab-tunnel:local
    restart: unless-stopped

    depends_on:
      - homelab-server

    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      HOME: /tmp
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:?Set CONTROL_PLANE_API_KEY in .env}

    command:
      - --control-plane.api-key=env:CONTROL_PLANE_API_KEY
      - --control-plane.tunnel-id=${TUNNEL_ID:?Set TUNNEL_ID in .env}
      - --mcp.server-url=http://homelab-server:8000/mcp

    tmpfs:
      - /tmp:size=16m,mode=1777

    networks:
      - homelab-backend
      - homelab-egress

networks:
  homelab-backend:
    internal: true

  mcp:
    external: true

  docker-proxy:
    external: true

  homelab-egress: {}

